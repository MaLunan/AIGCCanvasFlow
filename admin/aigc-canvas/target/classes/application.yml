server:
  port: 8084

spring:
  application:
    name: aigc-canvas
  config:
    # optional: 表示 Nacos 中该配置不存在时不报错（方便本地开发）
    import: optional:nacos:aigc-canvas-model-keys.yaml
  cloud:
    nacos:
      server-addr: localhost:8848
      discovery:
        server-addr: localhost:8848
      config:
        server-addr: localhost:8848
        namespace: public
        group: DEFAULT_GROUP
        file-extension: yaml
        refresh-enabled: true
  datasource:
    url: jdbc:mysql://localhost:3306/aigc_canvas?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 12345678
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: aigc-canvas-flow-jwt-secret-key-2024-minimum-32-chars

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

snowflake:
  worker-id: 1   # 节点 ID，多实例部署时每个实例设置不同值（0-31）

langchain:
  base-url: http://localhost:8000
  # 生图/生视频任务超时（毫秒）
  read-timeout: 120000
  connect-timeout: 5000

logging:
  level:
    com.aigc: debug
